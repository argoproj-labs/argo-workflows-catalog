# Jenkins icon https://jenkins.io/
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  annotations:
    workflows.argoproj.io/description: |
      This is a workflow template that allows you to run a Jenkinsfile pipeline in a
      container by using the `jenkins/jenkinsfile-runner` image.
    workflows.argoproj.io/maintainer: '@dcherman'
    workflows.argoproj.io/tags: jenkins,ci
    workflows.argoproj.io/version: '>= 2.9.0'
  name: jenkins-pipeline
spec:
  entrypoint: run-jenkins-pipeline
  templates:
  - name: run-jenkins-pipeline
    inputs:
      artifacts:
        - name: jenkinsfile
          path: /pipeline/jenkinsfile
        - name: plugins
          path: /pipeline/plugins.txt
          optional: true
      parameters:
      - name: image
        value: jenkins/jenkinsfile-runner
      - name: build-number
        value: "1"
      - name: cause
        value: "argo-workflow"
      - name: job-name
        value: "job"
    script:
      image: "{{inputs.parameters.image}}"
      command: [bash]
      source: |
        set -euox pipefail

        # The launcher passes --file (from JENKINSFILE_PATH) and --plugins
        # (the image's bundled plugins directory) itself.
        export JENKINSFILE_PATH=/pipeline/jenkinsfile

        # Optional extra plugins, installed alongside the bundled ones. Pin
        # versions compatible with the image's Jenkins version.
        if [[ -f /pipeline/plugins.txt ]]; then
          jenkins_version=$(sed -n 's/^Jenkins-Version: *//p' /app/jenkins/META-INF/MANIFEST.MF | tr -d '\r')
          java -jar /app/bin/jenkins-plugin-manager.jar \
            --jenkins-version "$jenkins_version" \
            --plugin-file /pipeline/plugins.txt \
            --plugin-download-directory /usr/share/jenkins/ref/plugins
        fi

        /app/bin/jenkinsfile-runner-launcher \
          --build-number="{{inputs.parameters.build-number}}" \
          --cause="{{inputs.parameters.cause}}" \
          --job-name="{{inputs.parameters.job-name}}"
